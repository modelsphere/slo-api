version: 2
updates:
  # The dependencies in pyproject.toml (there is no lock file).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # No docker entry: the Dockerfile's base image is a build arg
  # (FROM ${BASE_IMAGE}), which Dependabot cannot follow. Python upgrades are
  # done by hand, together with the README and CI.
