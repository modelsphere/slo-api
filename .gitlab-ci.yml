# Internal CI: tests on every push; a tag builds the image and pushes it to harbor.
# The public image is built by .github/workflows/release.yml from the same tag.
#
# Runs on the org's shared `public-buildx` runner, whose docker daemon already
# holds the harbor credentials, so there is no docker login here. That runner
# does not support a job-level `image:`, and its docker socket is the host's
# (`docker run -v $PWD:...` mounts a host path, not the job workspace), so the
# tests run inside a throwaway `docker build` instead of a container.
#
# The Dockerfile's base image and PyPI index are build args that default to
# public ones (Docker Hub / PyPI); this file overrides them with internal ones.
#
# Tags carry no leading v (0.1.1, not v0.1.1) and must equal the version in
# pyproject.toml; a prerelease suffix (0.1.1-rc1) builds without :latest.
# The tag must be on a commit that already has this file.

stages: [test, build]

variables:
  IMAGE: harbor.4pd.io/hardcore-tech/llm-slo-api
  DOCKER_BUILDKIT: "0"
  BASE_IMAGE: harbor.4pd.io/sagegpt-aio/pk_platform/ubuntu_python:24.04_3.12
  PIP_INDEX_URL: https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple
  # Tests deliberately do NOT use BASE_IMAGE: the runner's seccomp profile
  # blocks clone3, which glibc >= 2.34 uses to create threads, and these tests
  # start threads. musl creates threads with clone, so they run on alpine.
  # (Measured on slo-scaler-decision-gen, which shares this runner.)
  TEST_IMAGE: harbor.4pd.io/hardcore-tech/python:3.12-alpine

test:
  stage: test
  tags: [public-buildx]
  script:
    - |
      set -eu
      docker build --no-cache -f - -t "slo-api-ci-test:$CI_COMMIT_SHORT_SHA" . <<EOF
      FROM $TEST_IMAGE
      WORKDIR /src
      COPY . .
      ENV PIP_PROGRESS_BAR=off
      RUN pip install --no-cache-dir -i $PIP_INDEX_URL ".[dev]"
      RUN python3 -m pytest -q
      EOF
  after_script:
    - docker rmi "slo-api-ci-test:$CI_COMMIT_SHORT_SHA" >/dev/null 2>&1 || true

build:image:
  stage: build
  tags: [public-buildx]
  rules:
    - if: '$CI_COMMIT_TAG'
  before_script:
    - 'case "$CI_COMMIT_TAG" in *-*) PRERELEASE=1 ;; *) PRERELEASE= ;; esac'
    - 'echo "tag=$CI_COMMIT_TAG prerelease=${PRERELEASE:-0}"'
  script:
    # sed rather than tomllib: the runner's python is older than 3.11.
    - |
      set -eu
      PKG_VER=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\(.*\)"$/\1/p' pyproject.toml | head -1)
      if [ -z "$PKG_VER" ]; then echo "could not read version from pyproject.toml"; exit 1; fi
      TAG_VER="${CI_COMMIT_TAG#v}"
      BASE_VER="${TAG_VER%%-*}"
      if [ "$BASE_VER" != "$PKG_VER" ]; then
        echo "tag ${CI_COMMIT_TAG} (version ${BASE_VER}) does not match pyproject.toml version ${PKG_VER}"
        exit 1
      fi
    - >
      docker build
      --build-arg "BASE_IMAGE=$BASE_IMAGE"
      --build-arg "PIP_INDEX_URL=$PIP_INDEX_URL"
      -t "$IMAGE:$CI_COMMIT_TAG" .
    - docker push "$IMAGE:$CI_COMMIT_TAG"
    - if [ -z "$PRERELEASE" ]; then docker tag "$IMAGE:$CI_COMMIT_TAG" "$IMAGE:latest" && docker push "$IMAGE:latest"; fi
